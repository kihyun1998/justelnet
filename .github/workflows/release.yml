name: Release

on:
  push:
    tags:
      - "justelnet-core-v*"
      - "justelnet-v*"
      - "justelnet-expect-v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Read the crate and version from the tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          crate="${tag%-v*}"
          version="${tag##*-v}"
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
          if [ "$manifest" != "$version" ]; then
            echo "::error::tag $tag names $crate $version, but its Cargo.toml says ${manifest:-nothing}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $tag is not on main"
            exit 1
          fi
          echo "crate=$crate" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether crates.io already has it
        id: published
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "justelnet-release (github.com/kihyun1998/justelnet)" \
            "https://crates.io/api/v1/crates/${{ steps.tag.outputs.crate }}/${{ steps.tag.outputs.version }}")
          if [ "$code" = "200" ]; then
            echo "::notice::${{ steps.tag.outputs.crate }} ${{ steps.tag.outputs.version }} is already on crates.io"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.published.outputs.skip != 'true'
        id: auth

      - if: steps.published.outputs.skip != 'true'
        run: cargo publish -p "${{ steps.tag.outputs.crate }}" --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
