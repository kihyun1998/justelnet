[package]
name = "justelnet-expect"
version = "0.0.0"
description = "Expect-style automation over a justelnet client."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
justelnet = { version = "0.0.0", path = "../justelnet" }
regex = "1.13"
tokio = { version = "1.53", default-features = false, features = ["time"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt", "time", "test-util"] }
